<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="300" height="392" role="img" aria-label="Tony Tony Chopper">
  <title>Chopper</title>
  <defs>
    <radialGradient id="hat" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8FDDF0"/>
      <stop offset="1" stop-color="#4FB6D6"/>
    </radialGradient>
    <linearGradient id="antler" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B37A4E"/>
      <stop offset="1" stop-color="#8E5A35"/>
    </linearGradient>
    <pattern id="stripes" width="22" height="10" patternUnits="userSpaceOnUse" x="147">
      <rect width="11" height="10" fill="#FFFFFF"/>
      <rect x="11" width="11" height="10" fill="#F4C430"/>
      <rect x="10" width="1.5" height="10" fill="#F27B3A"/>
      <rect x="21" width="1.5" height="10" fill="#F27B3A"/>
    </pattern>
  </defs>

  <g stroke="#3A2A22" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- ground shadow -->
    <ellipse cx="180" cy="452" rx="92" ry="12" fill="#000" opacity="0.12" stroke="none"/>

    <!-- antlers -->
    <path d="M78 150 C48 162 20 146 16 112 C12 80 22 44 44 34 C60 28 72 40 68 58 C82 50 96 62 90 82 C100 106 98 134 78 150 Z" fill="url(#antler)"/>
    <path d="M36 70 C42 92 44 116 40 136 M58 64 C64 88 66 112 62 140" fill="none" stroke="#6E4428" stroke-width="2.5"/>
    <path d="M282 150 C312 162 344 146 346 108 C348 72 336 36 312 28 C296 24 286 38 292 56 C278 48 262 62 270 82 C260 106 262 134 282 150 Z" fill="url(#antler)"/>
    <path d="M324 64 C318 88 316 116 320 138 M300 62 C294 86 292 112 298 140" fill="none" stroke="#6E4428" stroke-width="2.5"/>

    <!-- legs + hooves -->
    <path d="M158 398 L152 432 L170 432 L172 398 Z M188 398 L190 432 L208 432 L202 398 Z" fill="#E8B783"/>
    <path d="M140 444 L150 428 L172 428 L176 444 L164 438 L158 446 Z" fill="#6E6A6A"/>
    <path d="M184 444 L188 428 L210 428 L220 444 L202 438 L196 446 Z" fill="#6E6A6A"/>

    <!-- arms + hooves -->
    <path d="M146 312 C130 320 112 334 98 352 L106 358 C120 344 136 332 150 326 Z" fill="#E8B783"/>
    <path d="M214 312 C230 320 248 334 262 352 L254 358 C240 344 224 332 210 326 Z" fill="#E8B783"/>
    <path d="M88 374 L96 350 L110 356 L108 372 L102 366 L98 378 Z" fill="#6E6A6A"/>
    <path d="M272 374 L264 350 L250 356 L252 372 L258 366 L262 378 Z" fill="#6E6A6A"/>

    <!-- shorts -->
    <path d="M146 372 L214 372 L220 402 L186 406 L180 394 L174 406 L140 402 Z" fill="#F27B3A"/>
    <path d="M180 384 L180 394" fill="none" stroke-width="2"/>

    <!-- striped tank top -->
    <path d="M150 300 L162 300 C166 312 194 312 198 300 L210 300 C214 324 216 350 216 378 L144 378 C144 350 146 324 150 300 Z" fill="url(#stripes)"/>

    <path d="M150 300 L162 300 L160 314 L150 312 Z M198 300 L210 300 L210 312 L200 314 Z" fill="#FFFFFF" stroke-width="2.5"/>
    <!-- hat flaps + strap rings -->
    <path d="M70 170 C62 206 64 250 76 282 L96 282 C92 248 92 206 100 176 Z" fill="url(#hat)"/>
    <path d="M290 170 C298 206 296 250 284 282 L264 282 C268 248 268 206 260 176 Z" fill="url(#hat)"/>
    <circle cx="274" cy="294" r="9" fill="none" stroke="#9AA3AD" stroke-width="4"/>

    <!-- face -->
    <path d="M108 208 C98 244 104 282 130 302 C150 316 210 316 230 302 C256 282 262 244 252 208 Z" fill="#E8B783"/>
    <!-- ears -->
    <path d="M100 236 C86 232 78 240 80 250 C90 256 102 252 108 246 Z" fill="#E8B783"/>
    <path d="M260 236 C274 232 282 240 280 250 C270 256 258 252 252 246 Z" fill="#E8B783"/>
    <path d="M92 240 C88 242 88 246 92 248 M268 240 C272 242 272 246 268 248" fill="none" stroke="#8E5A35"/>

    <!-- hat dome -->
    <path d="M62 190 C52 110 100 22 180 18 C260 22 308 110 298 190 Z" fill="url(#hat)"/>
    <!-- dots -->
    <g fill="#FFFFFF" stroke-width="2.5">
      <ellipse cx="96" cy="120" rx="6" ry="10" transform="rotate(20 96 120)"/>
      <ellipse cx="104" cy="82" rx="6" ry="10" transform="rotate(45 104 82)"/>
      <ellipse cx="130" cy="52" rx="6" ry="10" transform="rotate(70 130 52)"/>
      <ellipse cx="180" cy="40" rx="10" ry="6"/>
      <ellipse cx="230" cy="52" rx="6" ry="10" transform="rotate(-70 230 52)"/>
      <ellipse cx="256" cy="82" rx="6" ry="10" transform="rotate(-45 256 82)"/>
      <ellipse cx="264" cy="120" rx="6" ry="10" transform="rotate(-20 264 120)"/>
      <ellipse cx="84" cy="160" rx="6" ry="10"/>
      <ellipse cx="276" cy="160" rx="6" ry="10"/>
    </g>
    <!-- antler knobs + stitched patch -->
    <ellipse cx="66" cy="150" rx="12" ry="10" fill="#E8B783"/>
    <ellipse cx="294" cy="150" rx="12" ry="10" fill="#E8B783"/>
    <circle cx="276" cy="200" r="9" fill="#A6E3F2" stroke-width="2.5"/>
    <path d="M270 194 L282 206 M282 194 L270 206" fill="none" stroke-width="2"/>
    <!-- emblem -->
    <circle cx="180" cy="112" r="62" fill="#A6E3F2" stroke-width="2.5"/>
    <circle cx="180" cy="112" r="52" fill="#EE8A86"/>
    <g transform="translate(180 108) rotate(45)" fill="#FFFFFF" stroke-width="2.5">
      <path d="M-11 -36 H11 V-11 H36 V11 H11 V36 H-11 V11 H-36 V-11 H-11 Z"/>
    </g>

    <!-- brim -->
    <path d="M66 176 Q180 136 294 176 L296 196 Q240 190 180 214 Q120 190 64 198 Z" fill="#EE8A86"/>
    <path d="M86 190 Q130 186 180 204 Q230 186 274 190" fill="none" stroke="#D96C69" stroke-width="2.5"/>
    <path d="M100 172 Q180 150 260 172" fill="none" stroke="#F7B3AE" stroke-width="3"/>

    <!-- eyes -->
    <circle cx="150" cy="248" r="17" fill="#FFFFFF" stroke-width="3.5"/>
    <circle cx="212" cy="248" r="17" fill="#FFFFFF" stroke-width="3.5"/>
    <circle cx="154" cy="250" r="9" fill="#1B1B1B" stroke="none"/>
    <circle cx="208" cy="250" r="9" fill="#1B1B1B" stroke="none"/>
    <circle cx="157" cy="246" r="3" fill="#FFFFFF" stroke="none"/>
    <circle cx="211" cy="246" r="3" fill="#FFFFFF" stroke="none"/>
    <!-- worried brows -->
    <path d="M136 226 L160 222 M200 220 L224 227" fill="none" stroke-width="3.5"/>

    <!-- nose + mouth -->
    <path d="M170 274 Q181 268 192 274 Q188 288 181 289 Q174 288 170 274 Z" fill="#4A6FD0"/>
    <path d="M172 302 Q181 296 190 302" fill="none" stroke-width="3"/>
  </g>
</svg>
