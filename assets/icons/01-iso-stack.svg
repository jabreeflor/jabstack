<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="jabstack">
  <title>jabstack — isometric stack</title>
  <defs>
    <linearGradient id="plate" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#171C26"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#plate)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#2A3140" stroke-width="1"/>
  <g stroke="url(#plate)" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="32,33 57,44 32,55 7,44" fill="url(#a)" opacity="0.55"/>
    <polygon points="32,21 57,32 32,43 7,32" fill="url(#a)" opacity="0.8"/>
    <polygon points="32,9 57,20 32,31 7,20" fill="url(#a)"/>
  </g>
</svg>
